<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="shortcut icon" href="icon/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/site.webmanifest">
    <title>Solta a Voz! 🎤</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .search-container {
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        input {
            width: 60%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #cc0000;
        }
        .btn-mic {
            background-color: #28a745;
        }
        .btn-mic:hover {
            background-color: #218838;
        }
        .btn-mic.ouvindo {
            background-color: #dc3545;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        #results-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .video-card {
            background: #1e1e1e;
            padding: 15px;
            width: 280px;
            border-radius: 8px;
            text-align: left;
        }
        .video-card img {
            width: 100%;
            border-radius: 5px;
        }
        .video-card h4 {
            font-size: 14px;
            margin: 10px 0;
            height: 40px;
            overflow: hidden;
        }
        .video-card button {
            width: 100%;
            margin: 0 0 5px 0;
            padding: 8px;
            font-size: 14px;
        }
        .btn-yt {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-yt:hover {
            background-color: #444;
        }
        #player-container {
            margin-top: 40px;
        }
        iframe {
            width: 80%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Solta a Voz! 🎤✨</h1>
    <p>Pesquise ou use o microfone para falar o nome da música:</p>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="">
        <button class="btn-mic" id="micButton" onclick="ouvirVoz()" title="Falar o nome">🎙️ Falar</button>
        <button onclick="buscarNoYouTube()">Buscar 🔍</button>
    </div>

    <div id="player-container"></div>

    <div id="results-container"></div>

    <script>
        const API_KEY = 'AIzaSyC-7z7JjwfU16ioe6_xtmfIrCoAf8Zf52Y';
        let recognition = null;
        let estaOuvindo = false;
        let tempoLimiteBusca = null;

        const musicasSugeridas = [
            "Evidências", "As It Was", "Blinding Lights", "Bohemian Rhapsody", "Shape of You",
            "Garota de Ipanema", "Smells Like Teen Spirit", "Rolling in the Deep", "Levitating", "Bad Guy",
            "Just the Way You Are", "From the Start", "Notion", "Bad Habits", "Watermelon Sugar",
            "Flowers", "Stay", "Peaches", "Dynamite", "Drivers License",
            "Anti-Hero", "Butter", "Senorita", "Cardigan", "Locked Out of Heaven",
            "Counting Stars", "Sugar", "Havana", "Believer", "Take On Me"
        ];

        function definirPlaceholderAleatorio() {
            const input = document.getElementById('searchInput');
            const musicaAleatoria = musicasSugeridas[Math.floor(Math.random() * musicasSugeridas.length)];
            if (!estaOuvindo) {
                input.placeholder = "Ex: " + musicaAleatoria;
            }
        }

        window.onload = function() {
            definirPlaceholderAleatorio();

            const searchInput = document.getElementById('searchInput');

            searchInput.addEventListener('input', function() {
                clearTimeout(tempoLimiteBusca);
                tempoLimiteBusca = setTimeout(function() {
                    buscarNoYouTube();
                }, 400);
            });

            searchInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    clearTimeout(tempoLimiteBusca);
                    buscarNoYouTube();
                }
            });
        };

        function ouvirVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert('O seu navegador não suporta reconhecimento de voz.');
                return;
            }

            const micButton = document.getElementById('micButton');
            const searchInput = document.getElementById('searchInput');

            if (estaOuvindo) {
                if (recognition) {
                    recognition.stop();
                }
                return;
            }

            recognition = new SpeechRecognition();
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                estaOuvindo = true;
                micButton.classList.add('ouvindo');
                micButton.textContent = 'Parar 🛑';
                searchInput.placeholder = 'Pode falar o nome da música...';
            };

            recognition.onresult = function(event) {
                const textoFalado = event.results[0][0].transcript;
                searchInput.value = textoFalado;
                buscarNoYouTube();
            };

            recognition.onerror = function(event) {
                console.error('Erro no reconhecimento de voz:', event.error);
            };

            recognition.onend = function() {
                estaOuvindo = false;
                micButton.classList.remove('ouvindo');
                micButton.textContent = '🎙️ Falar';
                definirPlaceholderAleatorio();
            };

            recognition.start();
        }

        function buscarNoYouTube() {
            const termo = document.getElementById('searchInput').value;
            if (!termo.trim()) {
                document.getElementById('results-container').innerHTML = '';
                return;
            }

            const query = encodeURIComponent(termo + " karaoke");
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${query}&type=video&key=${API_KEY}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    exibirResultados(data.items);
                })
                .catch(error => {
                    console.error('Erro ao buscar:', error);
                });
        }

        function exibirResultados(videos) {
            const container = document.getElementById('results-container');
            container.innerHTML = ''; 

            if (!videos || videos.length === 0) {
                container.innerHTML = '<p>Nenhum vídeo encontrado.</p>';
                return;
            }

            videos.forEach(video => {
                const videoId = video.id.videoId;
                const titulo = video.snippet.title;
                const thumbnail = video.snippet.thumbnails.medium.url;
                const tituloEscapado = titulo.replace(/'/g, "\\'");

                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <img src="${thumbnail}" alt="${titulo}">
                    <h4>${titulo}</h4>
                    <button onclick="carregarPlayer('${videoId}', '${tituloEscapado}')">Cantar Aqui 🎤</button>
                    <a class="btn-yt" href="https://www.youtube.com/watch?v=${videoId}" target="_blank">Abrir no YouTube 🎬</a>
                `;
                container.appendChild(card);
            });
        }

        function carregarPlayer(videoId, titulo) {
            const playerContainer = document.getElementById('player-container');
            playerContainer.innerHTML = `
                <h3>Tocando agora: ${titulo}</h3>
                <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
